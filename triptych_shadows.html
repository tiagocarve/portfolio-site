<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIII — Triptychs: Shadows</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="nav.js"></script>
    <style>
      /* Triptych layout: 3 columns horizontally, stacking on smaller screens */
      .triptych-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        margin-bottom: 2.5rem;
      }
      @media (max-width: 768px) {
        .triptych-grid {
          grid-template-columns: 1fr;
        }
      }
      /* Uniform aspect ratio video wrapper */
      .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
        border: 1px solid #e0e0e0;
      }
      .video-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <header>
      
      
      <div id="nav-container"></div>
    </header>

    <main>
      <section class="bio-container">
        <p style="margin-bottom: 2rem;">
            <a href="triptychs.html" class="text-link">← back to triptychs</a>
        </p>

        <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem; font-weight: 600;">ttt: shadows</h2>
        <p style="font-size: 0.9rem; color: #666; margin-bottom: 2rem;">triptychs — -scapes + meditations</p>

        <!-- Three Video Loops Container -->
        <div class="triptych-grid">
            <div class="video-wrapper">
                <iframe src="https://player.vimeo.com/video/306596457?h=0&amp;badge=0&amp;autopause=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="video-wrapper">
                <iframe src="https://player.vimeo.com/video/306595733?h=0&amp;badge=0&amp;autopause=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="video-wrapper">
                <iframe src="https://player.vimeo.com/video/306597432?h=0&amp;badge=0&amp;autopause=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Project Statement / Description -->
        <div style="font-size: 0.95rem; line-height: 1.7; color: #333; display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 3rem; max-width: 700px;">
            <p>
                Part of the triptych series combining three independent short looped videos with three looped sounds, creating a continuously shifting generative experience[cite: 1].
            </p>
        </div>

      </section>
    </main>
  </body>
</html>
